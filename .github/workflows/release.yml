name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: memos.exe
            asset_stem: memos-windows-x86_64
            archive_ext: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: memos
            asset_stem: memos-macos-arm64
            archive_ext: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: memos
            asset_stem: memos-linux-x86_64
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run tests
        run: cargo test --release --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary and archive
        shell: bash
        run: |
          BIN_SRC="target/${{ matrix.target }}/release/${{ matrix.bin_name }}"
          DIST_DIR="dist"
          mkdir -p "${DIST_DIR}"

          # 1. 复制单一可执行文件（重命名为平台标识名）
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            STANDALONE_NAME="${{ matrix.asset_stem }}.exe"
            cp "${BIN_SRC}" "${DIST_DIR}/${STANDALONE_NAME}"
          else
            STANDALONE_NAME="${{ matrix.asset_stem }}"
            cp "${BIN_SRC}" "${DIST_DIR}/${STANDALONE_NAME}"
            chmod +x "${DIST_DIR}/${STANDALONE_NAME}"
          fi

          # 2. 准备归档目录（包含原始名字的二进制和 README）
          ARCHIVE_DIR="${{ matrix.asset_stem }}"
          mkdir -p "${ARCHIVE_DIR}"
          cp "${BIN_SRC}" "${ARCHIVE_DIR}/"
          cp README.md "${ARCHIVE_DIR}/"

          # 3. 打包压缩包
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            7z a "${DIST_DIR}/${{ matrix.asset_stem }}.zip" "${ARCHIVE_DIR}"
          else
            tar -czvf "${DIST_DIR}/${{ matrix.asset_stem }}.tar.gz" "${ARCHIVE_DIR}"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.asset_stem }}
          path: dist/*

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          generate_release_notes: true
