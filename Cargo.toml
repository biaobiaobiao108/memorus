[package]
name = "memos"
version = "0.1.0"
edition = "2021"
authors = ["steelway"]
description = "A fast and lightweight TUI & CLI memo tool written in Rust"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"
anyhow = "1.0"
unicode-width = "0.2"
